<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMS — GoodMoodScaner · Досуг в Павлодаре</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --sun:#FFC93C;--coral:#FF7A59;--mint:#3DDC97;--sky:#5BC0EB;
  --bg:#FFF9F0;--ink:#2E2A3B;--muted:#6B6478;--card:#FFFFFF;--line:#F1E3CC;--soft:#FFF1D6;--soft2:#E9F8F1;
  --shadow:0 10px 30px -12px rgba(255,122,89,.35);
  --display:'Unbounded','Nunito',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1E1A27;--ink:#F7EFE4;--muted:#B9AEC6;--card:#292335;--line:#3B3349;--soft:#33293A;--soft2:#203530;--shadow:0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#1E1A27;--ink:#F7EFE4;--muted:#B9AEC6;--card:#292335;--line:#3B3349;--soft:#33293A;--soft2:#203530;--shadow:0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
img,svg{max-width:100%}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0}
h2{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);max-width:62ch;margin:.6rem 0 0}
section{padding:72px 0}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:.02em}
.brand b i{font-style:normal;color:var(--coral)}
.brand small{display:block;font-size:.7rem;color:var(--muted);font-weight:700;margin-top:-3px}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:nowrap;overflow-x:auto}
nav.main a{text-decoration:none;font-weight:700;padding:8px 12px;border-radius:999px;font-size:.95rem;white-space:nowrap}
nav.main a:hover{background:var(--soft)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:999px;font-weight:800;font-size:.8rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.iconbtn{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem}
@media (max-width:900px){nav.main{display:none}}

/* hero */
.hero{padding:44px 0 64px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:720px;height:720px;right:-260px;top:-300px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sun) 55%,transparent),transparent 65%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:start;position:relative}
@media (max-width:960px){.hero-grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.2rem,5.4vw,4.1rem);font-weight:900;letter-spacing:-.025em;line-height:1.02}
.hero h1 .city{display:block;font-weight:500;font-size:.42em;letter-spacing:0;margin-top:.7em;color:var(--muted)}
.hero .sub{font-size:1.1rem}
.sunmark{width:min(260px,60vw);margin:34px 0 0}
.sunmark .rays{transform-origin:100px 100px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:960px){.sunmark{display:none}}

.panel{background:var(--card);border-radius:28px;padding:26px;box-shadow:var(--shadow);border:1px solid var(--line)}
.step+.step{margin-top:22px;padding-top:22px;border-top:1px dashed var(--line)}
.step h3{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step h3 .n{width:30px;height:30px;border-radius:50%;background:var(--sun);color:#2E2A3B;display:grid;place-items:center;font-size:.9rem;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.93rem;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--sun)}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#2E2A3B}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip .cnt{font-size:.75rem;background:var(--soft);border-radius:999px;padding:0 7px;color:var(--muted)}
.chip[aria-pressed="true"] .cnt{background:rgba(255,255,255,.6);color:#2E2A3B}
input[type=date],input[type=number],input[type=text],input[type=tel],select{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;min-height:42px}
.wx{font-weight:700;font-size:.9rem;color:var(--muted);padding:6px 12px;background:var(--soft2);border-radius:999px}
.fmts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.fmts{grid-template-columns:repeat(2,1fr)}}
.fmt{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:14px 8px;cursor:pointer;text-align:center;font-weight:800;font-size:.9rem;line-height:1.2}
.fmt span{display:block;font-size:1.9rem;margin-bottom:6px}
.fmt[aria-pressed="true"]{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--card))}
.extra{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.extra label{display:flex;flex-direction:column;font-size:.82rem;font-weight:700;color:var(--muted);gap:4px}
.extra input{width:110px}
.hint{color:var(--muted);font-size:.95rem;margin:0}
details.filters{margin-top:20px;border-radius:18px;background:var(--soft);padding:12px 16px}
details.filters summary{cursor:pointer;font-weight:800}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:14px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.85rem;color:var(--muted)}
.fgrid .check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.scan{position:relative;overflow:hidden;width:100%;margin-top:22px;border:0;border-radius:20px;padding:18px;font-family:var(--display);font-weight:700;font-size:1.1rem;cursor:pointer;color:#2E2A3B;background:linear-gradient(100deg,var(--sun),var(--coral));box-shadow:0 12px 26px -10px rgba(255,122,89,.7)}
.scan:hover{filter:saturate(1.15)}
.scan.busy::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:sweep .9s ease-in-out infinite}
@keyframes sweep{to{left:100%}}

/* results */
#results{display:none;padding-top:24px}
#results.show{display:block}
.res-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:end;margin-bottom:22px}
.res-head h2 small{display:block;font-family:var(--body);font-size:1rem;font-weight:700;color:var(--muted);margin-top:8px;letter-spacing:0}
.vtabs{display:flex;gap:6px}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
@media (max-width:960px){.res-grid{grid-template-columns:1fr}}
ol.timeline{list-style:none;margin:0;padding:0;position:relative}
ol.timeline::before{content:"";position:absolute;left:94px;top:10px;bottom:10px;width:3px;background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 14px)}
.tl-item{display:grid;grid-template-columns:80px 1fr;gap:34px;padding-bottom:22px;position:relative}
.tl-item::before{content:"";position:absolute;left:87px;top:12px;width:17px;height:17px;border-radius:50%;background:var(--c);border:3px solid var(--bg)}
.tl-time{text-align:right;padding-top:4px}
.tl-time b{font-family:var(--display);font-size:1.45rem;display:block;line-height:1}
.tl-time span{color:var(--muted);font-weight:700;font-size:.9rem}
.tl-body{background:var(--card);border-radius:22px;padding:18px 20px;border:1px solid var(--line);border-left:6px solid var(--c)}
.tl-travel{font-size:.85rem;color:var(--muted);font-weight:700;margin:-4px 0 6px}
.tl-body h4{font-size:1.08rem;font-weight:700}
.tl-place{margin:.25rem 0 0;color:var(--muted);font-weight:700;font-size:.92rem}
.tl-desc{margin:.45rem 0 0;font-size:.97rem}
.tl-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.price{font-weight:900;font-size:1.05rem}
.badge{font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--soft2)}
.badge.partner{background:color-mix(in srgb,var(--sky) 22%,var(--card))}
.tl-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:9px 16px;font-weight:800;cursor:pointer;background:var(--soft);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:.93rem}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--coral);color:#fff}
.btn.mint{background:var(--mint);color:#16352a}
@media (max-width:560px){ol.timeline::before{left:62px}.tl-item{grid-template-columns:52px 1fr;gap:26px}.tl-item::before{left:55px}.tl-time b{font-size:1.05rem}}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);background:var(--card);border-radius:24px;padding:22px;border:1px solid var(--line)}
.summary .tot{font-family:var(--display);font-size:2rem;font-weight:900;margin:.2rem 0}
.summary .bud{font-weight:700;font-size:.9rem}
.summary .bud.ok{color:#1f9a63}.summary .bud.over{color:var(--coral)}
.summary .acts{display:grid;gap:8px;margin-top:16px}
.summary .acts .btn{justify-content:center}
.sharebar{display:flex;gap:8px;margin-top:6px}
.sharebar .btn{flex:1;justify-content:center;padding:9px 6px;font-size:.85rem}
.pl{margin-top:16px;border-radius:18px;padding:14px;background:var(--soft2);font-size:.92rem}
.pl b{display:block;margin-bottom:6px}
.pl .row a{font-size:.82rem}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:24px;padding:30px;text-align:center;font-weight:700}

/* map */
#map{height:520px;border-radius:28px;overflow:hidden;border:1px solid var(--line);margin-top:20px;z-index:1}
.map-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.25);border:2px solid #fff}
.pin>span{transform:rotate(45deg);font-size:16px}
.num{width:30px;height:30px;border-radius:50%;background:var(--coral);color:#fff;font-weight:900;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.3);font-family:var(--body)}
.leaflet-popup-content{font-family:var(--body);font-size:14px}
.pop b{font-size:15px}
.pop p{margin:4px 0}

/* events */
.events{display:flex;gap:16px;overflow-x:auto;padding:22px 2px 10px;scroll-snap-type:x mandatory}
.ev{flex:0 0 260px;scroll-snap-align:start;background:var(--card);border-radius:24px;padding:18px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ev .when{font-weight:900;color:var(--coral);font-size:.9rem}
.ev h4{font-size:1rem;font-weight:700}
.ev p{margin:0;color:var(--muted);font-size:.9rem;font-weight:700}
.ev .btn{margin-top:auto;align-self:flex-start}
.ev .em{font-size:2rem}

/* music */
.music{background:linear-gradient(160deg,color-mix(in srgb,var(--sky) 20%,var(--bg)),var(--bg))}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:26px}
@media (max-width:860px){.mgrid{grid-template-columns:1fr}}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mood{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:16px 10px;font-weight:800;cursor:pointer;text-align:center}
.mood span{display:block;font-size:1.8rem}
.mood[aria-pressed="true"]{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 18%,var(--card))}
.lbl{font-weight:800;margin:0 0 10px;color:var(--muted);font-size:.9rem}
.player{background:var(--card);border-radius:28px;padding:26px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.player .disc{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--sun),var(--coral),var(--sky),var(--mint),var(--sun));display:grid;place-items:center}
.player .disc::after{content:"";width:28px;height:28px;border-radius:50%;background:var(--card)}
.player.playing .disc{animation:spin 6s linear infinite}
.player h3{font-size:1.3rem}
.player p{margin:0;color:var(--muted)}

/* recipes */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:22px}
.rc{background:var(--card);border-radius:24px;border:1px solid var(--line);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.rc .pic{height:120px;display:grid;place-items:center;font-size:3.6rem;background:var(--soft)}
.rc .in{padding:16px}
.rc h4{font-size:1rem;font-weight:700}
.rc .meta{display:flex;gap:12px;color:var(--muted);font-weight:700;font-size:.85rem;margin-top:8px}
.stars{color:#F5A500;font-weight:900}

/* partners */
.partners .box{background:var(--ink);color:var(--bg);border-radius:32px;padding:40px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}
.partners .box p{color:color-mix(in srgb,var(--bg) 75%,transparent);margin:.8rem 0 0}
@media (max-width:760px){.partners .box{grid-template-columns:1fr}}
footer{padding:36px 0 120px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(30,26,39,.55);padding:16px}
.modal.open{display:grid}
.mbox{background:var(--card);border-radius:28px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px;position:relative}
.mbox h3{font-size:1.25rem;margin-bottom:10px;padding-right:40px}
.mbox .x{position:absolute;top:16px;right:16px}
.form{display:grid;gap:12px;margin-top:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.88rem;color:var(--muted)}
.pays{display:grid;gap:8px}
.pays label{flex-direction:row;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);cursor:pointer}
.okbox{text-align:center;padding:10px 0}
.okbox .big{font-size:3rem}
.okbox code{font-family:var(--display);font-size:1.4rem;background:var(--soft);padding:6px 14px;border-radius:12px;display:inline-block;margin:8px 0}
.ing{padding-left:18px}.ing li{margin:4px 0}
.steps li{margin:6px 0}
.srv{display:flex;align-items:center;gap:10px;margin:10px 0}
.srv button{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);font-weight:900;cursor:pointer}

/* chat */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;border:0;border-radius:999px;padding:14px 20px;font-weight:900;cursor:pointer;background:var(--ink);color:var(--bg);box-shadow:0 12px 28px -8px rgba(0,0,0,.45);display:flex;gap:8px;align-items:center}
.chat{position:fixed;right:20px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:95;width:min(390px,calc(100vw - 32px));height:min(560px,70vh);background:var(--card);border-radius:26px;border:1px solid var(--line);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);display:none;flex-direction:column;overflow:hidden}
.chat.open{display:flex}
.chat header{padding:14px 18px;background:linear-gradient(100deg,var(--sun),var(--coral));color:#2E2A3B;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.chat header button{border:0;background:rgba(255,255,255,.5);border-radius:50%;width:30px;height:30px;cursor:pointer}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:.95rem;white-space:pre-line}
.msg.bot{background:var(--soft);border-bottom-left-radius:6px}
.msg.me{background:var(--coral);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px}
.quick .chip{font-size:.8rem;padding:5px 10px;white-space:nowrap}
.chat form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat form input{flex:1;min-width:0}
.chat form button{border:0;border-radius:12px;padding:0 14px;font-weight:900;cursor:pointer;background:var(--coral);color:#fff}
.chat form .mic{background:var(--soft);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(200%);opacity:0;visibility:hidden;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:800;z-index:200;transition:transform .25s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
@media print{
  header.top,.hero,#mapSec,#events,#music,#recipes,.partners,footer,.fab,.chat,.tl-actions,.summary .acts,.vtabs,.pl{display:none!important}
  body{background:#fff;color:#000}
  #results{display:block!important}
  .res-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="GMS — GoodMoodScaner">
      <svg width="40" height="44" viewBox="40 8 124 164" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF7A59"/></linearGradient></defs>
        <path d="M102 168C102 168 42 110 42 74A60 60 0 0 1 162 74C162 110 102 168 102 168Z" fill="url(#lg)"/>
        <circle cx="102" cy="74" r="36" fill="#FFF9F0"/><circle cx="102" cy="74" r="20" fill="#FFC93C"/>
        <circle cx="94" cy="70" r="3" fill="#2E2A3B"/><circle cx="110" cy="70" r="3" fill="#2E2A3B"/>
        <path d="M92 78Q102 88 112 78" fill="none" stroke="#2E2A3B" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span><b>G<i>M</i>S</b><small>GoodMoodScaner</small></span>
    </a>
    <nav class="main" aria-label="Разделы">
      <a href="#top" data-i18n="nav_plan"></a>
      <a href="#mapSec" data-i18n="nav_map"></a>
      <a href="#events" data-i18n="nav_events"></a>
      <a href="#music" data-i18n="nav_music"></a>
      <a href="#recipes" data-i18n="nav_recipes"></a>
      <a href="#partners" data-i18n="nav_partners"></a>
    </nav>
    <div class="tools">
      <div class="seg" role="group" aria-label="Язык / Тіл / Language">
        <button data-lang="ru">RU</button><button data-lang="kz">KZ</button><button data-lang="en">EN</button>
      </div>

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const toMin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dObj=s=>new Date(s+'T12:00:00');
const money=n=>n===0?t('free'):n.toLocaleString('ru-RU').replace(/,/g,' ')+' ₸';

const catName=c=>LL(CATS[c]);
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2600)}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function km(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function travel(a,b){if(!a||!b)return 0;if(a.cat==='nature'&&a.dur>300)return 0;const k=km(a,b);if(k<.3)return 5;return Math.ceil((k/30*60+8)/5)*5}
function nextSat(){const d=new Date();const diff=(6-d.getDay()+7)%7;d.setDate(d.getDate()+diff);return iso(d)}
function available(it,ds){const d=dObj(ds);return it.days.includes(d.getDay())&&(!it.months||it.months.includes(d.getMonth()+1))}
function suits(it,fmt=S.format){const code={solo:'s',pair:'p',group:'g',family:'f'}[fmt];if(!it.tags.includes(code))return false;if(fmt==='family'&&it.age>S.young)return false;return true}
function cityOk(it){return S.city==='all'||it.city===S.city}
function qty(){return S.format==='solo'?1:S.format==='pair'?2:S.format==='group'?S.people:S.adults+S.kidsN}
function cost(it,q=qty()){return it.unit==='group'?it.price:it.price*q}
function slot(it,after,end){
  if(it.times){const s=it.times.map(toMin).find(x=>x>=after);if(s===undefined||s+it.dur>end+75)return;return s}
  let s=Math.max(after,it.open[0]*60);s=Math.ceil(s/10)*10;if(s+it.dur>Math.min(it.open[1]*60,end))return;return s;
}
function win(){const m={all:[600,1320],morning:[570,840],day:[720,1080],evening:[1020,1380]};let[a,b]=m[S.tod];if(S.format==='family')b=Math.min(b,1260);
  if(S.date===iso(new Date())){const n=new Date();a=Math.max(a,Math.ceil((n.getHours()*60+n.getMinutes())/15)*15+30)}return[a,b]}
function rainy(){const w=S.weather[S.date];return w&&w.p>=60}
function pool(){return ITEMS.filter(it=>available(it,S.date)&&suits(it)&&cityOk(it)&&(!S.online||it.book!=='free')&&(!S.cats.size||S.cats.has(it.cat)))}

/* ===================== Scenario engine ===================== */
function build(seed){
  const R=rng(seed),[a,b]=win(),P=pool(),plan=[],used=new Set(),catUsed={};let tm=a,prev=null,total=0,meal=false;
  for(let k=0;k<6&&tm<b-30;k++){
    const c=[];
    for(const it of P){
      if(used.has(it.id))continue;
      if(it.dur>300&&plan.length)continue;
      if(catUsed[it.cat]&&(it.cat==='food'?catUsed.food>=2:S.cats.size!==1))continue;
      const tr=travel(prev,it),s=slot(it,tm+tr,b);if(s===undefined)continue;
      const wait=s-(tm+tr);if(wait>100)continue;
      const cs=cost(it);if(S.budget&&total+cs>S.budget)continue;
      let sc=it.rating*1.2+R()*2.4-wait/25-tr/15;
      sc+=catUsed[it.cat]?-4.5*catUsed[it.cat]:2;
      if(it.cat==='food'){const mt=(s>=720&&s<=870)||(s>=1080&&s<=1230);sc+=meal?-9:(mt?4:-1.5)}
      if(it.cat==='sale'&&!S.cats.has('sale'))sc-=1.5;
      if(it.outdoor&&rainy())sc-=3;
      if(it.dur>300)sc+=1;
      c.push({it,s,tr,sc,cs});
    }
    if(!c.length)break;
    c.sort((x,y)=>y.sc-x.sc);const top=c.slice(0,3);const pick=top[Math.floor(R()*R()*top.length)];
    plan.push({id:pick.it.id,start:pick.s,end:pick.s+pick.it.dur,tr:plan.length?pick.tr:0,cost:pick.cs});
    used.add(pick.it.id);catUsed[pick.it.cat]=(catUsed[pick.it.cat]||0)+1;if(pick.it.cat==='food')meal=true;
    total+=pick.cs;tm=pick.s+pick.it.dur;prev=pick.it;
  }
  return plan;
}
function makeVariants(){const out=[],sig=new Set(),base=Date.now()%100000;for(let i=0;i<12&&out.length<3;i++){const p=build(base+i*7919);if(!p.length)continue;const s=p.map(x=>x.id).join();if(sig.has(s))continue;sig.add(s);out.push(p)}return out}
const planTotal=p=>p.reduce((s,x)=>s+x.cost,0);
function swap(idx){
  const p=S.variants[S.vi],cur=p[idx],[a,b]=win();const prevIt=idx?BYID[p[idx-1].id]:null,prevEnd=idx?p[idx-1].end:a,next=p[idx+1],nextIt=next?BYID[next.id]:null;
  const inPlan=new Set(p.map(x=>x.id)),tot=planTotal(p)-cur.cost;
  const c=pool().filter(it=>!inPlan.has(it.id)&&it.dur<=300).map(it=>{const tr=travel(prevIt,it),s=slot(it,prevEnd+tr,next?next.start:b);if(s===undefined)return null;const e=s+it.dur;if(next&&e+travel(it,nextIt)>next.start)return null;const cs=cost(it);if(S.budget&&tot+cs>S.budget)return null;return{it,s,tr,cs}}).filter(Boolean);
  if(!c.length){toast(t('replace_none'));return}
  c.sort((x,y)=>(x.it.cat===BYID[cur.id].cat?1:0)-(y.it.cat===BYID[cur.id].cat?1:0)||Math.random()-.5);
  const n=c[0];p[idx]={id:n.it.id,start:n.s,end:n.s+n.it.dur,tr:idx?n.tr:0,cost:n.cs};
  if(next)next.tr=travel(n.it,nextIt);
  renderResults();toast(t('replaced'));
}

function renderCats(){const box=$('#cats');

function readFilters(){S.budget=+$('#budgetIn').value||0;S.tod=$('#todIn').value;S.city=$('#cityIn').value;S.online=$('#onlineIn').checked}

  const sec=$('#results'),w=$('#resWrap');sec.classList.add('show');
  const wx=S.weather[S.date];
  let h=`<div class="res-head"><h2>${t('res_title')}: ${dateLabel(S.date)}<small>${fmtSummary()}${wx?` · ${wx.i} ${wx.hi}°`:''}${rainy()?' — '+t('weather_rain'):''}</small></h2>`;

  if(!S.variants.length){w.innerHTML=h+`<div class="empty">🔎 ${t('no_results')}</div>`;bindRes();return}
  const p=S.variants[S.vi],q=qty(),tot=planTotal(p);

  p.forEach((x,i)=>{const it=BYID[x.id],c=CATS[it.cat];
    const pr=it.price===0?t('free'):it.unit==='group'?`${money(it.price)} ${t('per_group')}`:q>1?`${money(it.price)} × ${q} = ${money(x.cost)}`:money(x.cost);

function renderMapTools(){const all=mapCats.size===Object.keys(CATS).length;

function fmtAmt(n,u){if(u==='шт'||u.startsWith('зубч'))return String(Math.max(1,Math.round(n)));if(n>=10)return String(Math.round(n/5)*5||Math.round(n));const r=Math.round(n*2)/2;return String(r||0.5).replace('.',',')}

/* ===================== AI assistant (demo, rule-based on GMS data) ===================== */
const KW={cinema:/кино|фильм|сеанс|cinema|movie|film/,food:/ресторан|кафе|поесть|покуш|ужин|обед|еда|кофе|тамақ|мейрамхана|restaurant|cafe|food|dinner|lunch/,theatre:/театр|спектакл|theat|play\b/,spa:/спа|spa|хаммам|баня/,massage:/массаж|massage/,
 sport:/хоккей|футбол|матч|забег|hockey|football|match|спорттық/,gym:/спортзал|фитнес|тренаж|йог|бассейн|кроссфит|gym|fitness|yoga|pool/,exh:/выставк|музе|галере|көрме|exhibit|museum|gallery/,mk:/мастер|класс|workshop|шебер/,concert:/концерт|гастрол|джаз|стендап|concert|stand.?up|gig/,
 sale:/распрод|скидк|шопинг|акци|sale|shopping|жеңілдік/,nature:/природ|баянаул|загород|набережн|конн|лошад|nature|outdoor|horse|табиғат/,ent:/батут|боулинг|квест|картинг|развлеч|bowling|quest|karting|trampoline|ойын/};
function addMsg(txt,who='bot'){const d=document.createElement('div');d.className='msg '+who;d.textContent=txt;$('#msgs').appendChild(d);$('#msgs').scrollTop=1e6}
function parse(raw){const s=raw.toLowerCase(),r={};
  if(/вдво|девушк|парн|жен[ао]й|муж|свидан|пара|екеу|date|couple|girlfriend|boyfriend|wife|husband/.test(s))r.format='pair';
  if(/друз|компан|коллег|достар|friends|group|team/.test(s))r.format='group';
  if(/дет|реб[её]н|сын|доч|семь|бала|отбасы|kid|child|family|son|daughter/.test(s))r.format='family';
  if(/один|одна|сам\b|в одиночку|жалғыз|alone|solo|by myself/.test(s))r.format='solo';
  const bm=s.match(/(\d[\d\s]*)\s*(тыс|тысяч|к\b|k\b|мың)/)||s.match(/(?:бюджет|до|budget|up to|дейін)\s*(\d[\d\s]{2,})/);
  if(bm){let n=parseInt(bm[1].replace(/\s/g,''));if(bm[2])n*=1000;if(n>=500)r.budget=n}
  const pm=s.match(/(\d+)\s*(чел|человек|друз|адам|people|friends)/);if(pm)r.people=+pm[1];
  const am=s.match(/(\d+)\s*(лет|год|жас|years?|y\.?o)/);if(am)r.young=+am[1];
  if(/сегодня|бүгін|today|tonight/.test(s))r.date=iso(new Date());
  else if(/послезавтра/.test(s))r.date=iso(new Date(Date.now()+1728e5));
  else if(/завтра|ертең|tomorrow/.test(s))r.date=iso(new Date(Date.now()+864e5));
  else{const dn=[[/воскрес|жексенбі|sunday/,0],[/понедел|дүйсенбі|monday/,1],[/вторник|сейсенбі|tuesday/,2],[/сред[ау]|сәрсенбі|wednesday/,3],[/четверг|бейсенбі|thursday/,4],[/пятниц|жұма|friday/,5],[/суббот|сенбі|saturday|выходн|weekend|демалыс/,6]];
    for(const[re,w]of dn)if(re.test(s)){const d=new Date();d.setDate(d.getDate()+((w-d.getDay()+7)%7));r.date=iso(d);break}}
  if(/утр|таң|morning/.test(s))r.tod='morning';else if(/вечер|кеш|evening|night/.test(s))r.tod='evening';else if(/днём|днем|күндіз|afternoon/.test(s))r.tod='day';
  if(/экибастуз|ekibastuz/.test(s))r.city='Экибастуз';else if(/аксу|aksu/.test(s))r.city='Аксу';else if(/баянаул|bayanaul/.test(s))r.city='all';
  r.cats=Object.keys(KW).filter(k=>KW[k].test(s));
  return r}
function venueAnswer(s){for(const it of ITEMS){const m=it.name.match(/«(.+?)»/);const key=(m?m[1]:it.name).toLowerCase();const pm=it.place.match(/«(.+?)»/);const key2=pm?pm[1].toLowerCase():null;
  if(s.includes(key)||(key2&&s.includes(key2))){const sch=it.times?it.times.join(', '):`${pad(it.open[0])}:00–${pad(it.open[1])}:00`;
   return `${CATS[it.cat].e} ${it.name}\n📍 ${it.place}, ${it.city}\n🕒 ${sch}\n💰 ${it.price?money(it.price):t('free')}${it.age?`\n🔞 ${it.age}+`:''}\n${it.desc}`}}return null}
async function handle(raw){addMsg(raw,'me');const s=raw.toLowerCase();
  if(/музык|песн|плейлист|music|playlist|song|әуен|ән/.test(s)){const mm=[['party',/вечерин|party|той|танц/],['romance',/романт|romantic|свидан/],['chill',/расслаб|спокой|chill|relax/],['kids',/дет|kid|бала/],['road',/дорог|road|жол/],['energy',/энерг|бодр|energy|спорт|workout/]].find(x=>x[1].test(s));
    if(mm){S.mood=mm[0]}renderMusic();$('#music').scrollIntoView({behavior:'smooth'});
    addMsg(LL({ru:`Открыл раздел музыки: настроение «${LL(MOODS.find(m=>m.id===S.mood))}». Выберите жанр и сервис.`,kz:`Музыка бөлімін аштым: «${LL(MOODS.find(m=>m.id===S.mood))}». Жанр мен сервисті таңдаңыз.`,en:`Opened music: "${LL(MOODS.find(m=>m.id===S.mood))}" mood. Pick a genre and a service.`}));return}
  if(/рецепт|приготов|recipe|cook|тағам/.test(s)){S.rcat=/пикник|picnic/.test(s)?'picnic':/романт|свидан|date/.test(s)?'date':/дет|kid|бала/.test(s)?'kids':/национ|казах|ұлттық|kazakh/.test(s)?'national':'all';renderRecipes();$('#recipes').scrollIntoView({behavior:'smooth'});
    addMsg(LL({ru:'Подобрал рецепты с рейтингом от 4,6 — откройте карточку, чтобы пересчитать порции.',kz:'4,6-дан жоғары рейтингті рецепттерді таңдадым.',en:'Here are recipes rated 4.6+. Open one to scale the servings.'}));return}
  if(/погод|ауа рай|weather|дожд|rain/.test(s)){const ds=S.date||nextSat(),w=S.weather[ds];
    addMsg(w?LL({ru:`${dateLabel(ds)}: ${w.i} до ${w.hi}°, вероятность осадков ${w.p}%.${w.p>=60?' Советую крытые развлечения.':''}`,kz:`${dateLabel(ds)}: ${w.i} ${w.hi}°, жауын ықтималдығы ${w.p}%.`,en:`${dateLabel(ds)}: ${w.i} up to ${w.hi}°, ${w.p}% chance of rain.`}):LL({ru:'Прогноз на эту дату пока недоступен.',kz:'Бұл күнге болжам әзірге жоқ.',en:'No forecast for that date yet.'}));return}
  if(/дешевл|подешев|арзан|cheaper|less money/.test(s)&&S.variants.length){S.budget=Math.max(1000,Math.round(planTotal(S.variants[S.vi])*.7/1000)*1000);$('#budgetIn').value=S.budget;await scan(false);reportPlan();return}
  const va=venueAnswer(s);const r=parse(raw);const actionable=r.format||r.date||r.budget||r.cats.length||r.tod;
  if(va&&!actionable){addMsg(va);return}
  if(!actionable){addMsg(LL({ru:'Уточните, пожалуйста: когда и с кем вы хотите отдохнуть? Можно добавить бюджет и интересы — кино, спа, театр, спортзал, природа.',kz:'Нақтылаңызшы: қашан және кіммен демалғыңыз келеді? Бюджет пен қызығушылықты қосуға болады.',en:'When and with whom would you like to go out? You can add a budget and interests — cinema, spa, theatre, gym, nature.'}));return}
  if(r.format)setFormat(r.format);if(r.people)S.people=r.people;if(r.young!=null){S.young=r.young;if(!r.format)setFormat('family')}
  renderExtra();if(r.budget)$('#budgetIn').value=r.budget;if(r.tod)$('#todIn').value=r.tod;if(r.city)$('#cityIn').value=r.city;
  setDate(r.date||S.date||nextSat());if(r.cats.length){S.cats=new Set(r.cats);renderCats()}
  await scan(false);reportPlan();if(window.innerWidth>700)$('#results').scrollIntoView({behavior:'smooth'})}
function reportPlan(){if(!S.variants.length){addMsg(t('no_results'));return}const p=S.variants[S.vi];
  addMsg(LL({ru:'Готово! План на ',kz:'Дайын! Жоспар: ',en:'Done! Plan for '})+dateLabel(S.date)+':\n'+p.map(x=>`${hm(x.start)} ${CATS[BYID[x.id].cat].e} ${BYID[x.id].name}`).join('\n')+`\n${t('total')}: ${money(planTotal(p))}`+LL({ru:'\nМожно написать «сделай дешевле» или заменить пункт кнопкой 🔄.',kz:'\n«Арзанырақ жаса» деп жазуға болады.',en:'\nSay "make it cheaper" or swap an item with 🔄.'}))}
function renderQuick(){$('#quick').innerHTML=['q1','q2','q3','q4'].map(k=>`<button class="chip" data-q="${k}">${t(k)}</button>`).join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>handle(t(b.dataset.q)))}

/* ===================== i18n apply, weather, init ===================== */
function applyI18n(){document.documentElement.lang=lang==='kz'?'kk':lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  renderExtra();renderCats();renderMapTools();renderEvents();renderMusic();renderRecipes();renderQuick();
  if(S.variants.length||$('#results').classList.contains('show'))renderResults();
  const ms=$('#msgs');if(ms.children.length<=1){ms.innerHTML='';addMsg(t('chat_hello'))}}
async function loadWeather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.29&longitude=76.97&daily=weathercode,temperature_2m_max,precipitation_probability_max&timezone=auto&forecast_days=16');const j=await r.json();
  const ic=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=67?'🌧️':c<=77?'❄️':c<=82?'🌦️':c<=86?'🌨️':'⛈️';
  j.daily.time.forEach((d,i)=>S.weather[d]={i:ic(j.daily.weathercode[i]),hi:Math.round(j.daily.temperature_2m_max[i]),p:j.daily.precipitation_probability_max[i]??0});renderWx()}catch(e){}}
function init(){
  $('#dateIn').min=iso(new Date());
  document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>setDate(b.dataset.quick==='today'?iso(new Date()):b.dataset.quick==='tomorrow'?iso(new Date(Date.now()+864e5)):nextSat()));
  $('#dateIn').onchange=e=>e.target.value&&setDate(e.target.value);
  document.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>setFormat(b.dataset.fmt));
  $('#cityIn').onchange=()=>{S.city=$('#cityIn').value;renderCats()};
  $('#scanBtn').onclick=()=>scan();
  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyI18n()});
  $('#themeBtn').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';$('#themeBtn').textContent=dark?'🌙':'☀️'};
  $('#modalX').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  $('#fab').onclick=()=>{$('#chat').classList.toggle('open');if($('#chat').classList.contains('open'))$('#chatIn').focus()};$('#chatX').onclick=()=>$('#chat').classList.remove('open');
  $('#chatForm').onsubmit=e=>{e.preventDefault();const v=$('#chatIn').value.trim();if(v){$('#chatIn').value='';handle(v)}};
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){$('#micBtn').hidden=false;$('#micBtn').onclick=()=>{const r=new SR();r.lang={ru:'ru-RU',kz:'kk-KZ',en:'en-US'}[lang];r.onresult=e=>handle(e.results[0][0].transcript);r.start()}}
  $('#partnerBtn').onclick=()=>openModal(`<h3>🏪 ${t('partners_btn')}</h3><div class="form"><label>${t('name')}<input type="text" id="pn"></label><label>${t('phone')}<input type="tel" id="pp"></label><button class="btn primary" style="justify-content:center;padding:12px" onclick="this.closest('.mbox').querySelector('#mbody').innerHTML='<div class=okbox><div class=big>🤝</div><p>'+t('partner_ok')+'</p></div>'">${t('partners_btn')}</button></div>`);
  setFormat('pair');initMap();applyI18n();loadWeather();
}
init();
</script>
